.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

.big{font-size:34px;line-height:1.1;font-weight:700;margin:0 0 8px}

{d:'2026-11-03',dl:'3 Nov 2026',t:'Packaging (PPWR)',h:'Commissioner: existing reuse systems can carry on',s:'EU Commissioner Jessika Roswall said existing reuse systems are recognised as compliant as long as they meet Article 26 and Annex VI. A separate implementing act will set which data are needed to count rotations, and how.',w:'Open exchange pools and closed pooling can both count as reuse systems. How rotations must be proven is still open.',src:'Packaging Europe',u:'https://www.packagingeurope.com/eu-commissioner-jessika-roswall-clarifies-ppwrs-reuse-requirements/'},
{d:'2026-11-04',dl:'Updated 4 Nov 2026',t:'Packaging (PPWR)',h:'EU packaging label pushed to 2027',s:'The implementing act for the harmonised packaging label was due on 12 August 2026. The Commission now plans to adopt it in the second quarter of 2027, which puts the label at mid-2029 at the earliest.',w:'Labels on reusable pallets come later than planned.',src:'Carbonorm PPWR guide',u:'https://carbonorm.io/guides/ppwr-compliance'},
{d:'2026-10-24',dl:'24 Oct 2026',t:'Packaging (PPWR)',h:'Reuse calculation rules still not adopted',s:'The Article 30(3) act that sets how reuse targets are calculated had not been adopted by 24 October 2026. It is due by 30 June 2027. Proof of the 2030 targets applies from 1 January 2030 or 18 months after that act, whichever is later.',w:'Any reuse share shown by this tool is an estimate until the EU method exists.',src:'packagingregulation.org',u:'https://packagingregulation.org/reuse/'},
{d:'2026-11-07',dl:'Nov 2026',t:'Forests (EUDR)',h:'EUDR dates hold: 30 December 2026',s:'As of November 2026 no proposal to move the dates has been made. Large and medium companies apply the EUDR from 30 December 2026, most micro and small companies from 30 June 2027.',w:'New white pallets bought from 30 December need an origin trail from the pallet maker.',src:'SmartSolve',u:'https://smartsolve.com/news/what-is-eudr/'},
{d:'2026-09-18',dl:'18 Sep 2026',t:'Forests (EUDR)',h:'Loaded and used pallets fall outside the EUDR',s:'A delegated act that rewrote the EUDR product list came into force on 18 September 2026. Pallets used to carry goods and used products are out of scope. New wood still needs due diligence from 30 December 2026.',w:'Renting or exchanging pallets that are in use is not covered. Buying new pallets still brings paperwork through the seller.',src:'Wood Central',u:'https://woodcentral.com.au/eudr-used-products-bamboo/'},
{d:'2026-08-12',dl:'12 Aug 2026',t:'Packaging (PPWR)',h:'EPAL model declaration for Euro pallets',s:'EPAL announced it would publish the final model of the EU Declaration of Conformity for EPAL Euro pallets on 12 August 2026, the day the PPWR started to apply.',w:'Makes the PPWR paperwork for white pallets easier to get from the pallet maker.',src:'EPAL',u:'https://www.epal-pallets.org/fileadmin/user_upload/ntg_package/Presse/DE/Begleitmaterial/PPWR-Konformitaetserklaerung_EPAL-1_DE.pdf'},
{d:'2026-08-07',dl:'7 Aug 2026',t:'Reporting (CSRD)',h:'First CSRD reports for wave 2 move to 2028',s:'After Omnibus I (Directive (EU) 2026/470) only companies with over 1,000 staff and €450 million turnover must report. Their first report comes in 2028, covering financial year 2027.',w:'Large dairies need pallet CO₂e and material data from 2027 onwards.',src:'OneStopESG',u:'https://onestopesg.com/esg-resources/article/csrd-wave-2-omnibus-2026'},
{d:'2026-07-01',dl:'1 Jul 2026',t:'Transport',h:'Dutch truck toll is live',s:'Since 1 July 2026 trucks over 3.5 tonnes pay per kilometre on Dutch roads. From 1 September to 31 December 2026 rates are 22.3% lower, cutting the average from €0.191 to €0.148 per km. Regular indexed rates return on 1 January 2027.',w:'Every empty-pallet kilometre costs more. The truck cost setting in this tool includes the toll.',src:'Taxence',u:'https://www.taxence.nl/?p=164341'},
{d:'2026-03-06',dl:'6 Mar 2026',t:'Carbon price',h:'EU carbon price on road fuel starts in 2028',s:'The second EU emissions trading system (ETS2), which puts a carbon price on road transport fuel, was postponed by one year to 2028.',w:'From 2028 diesel carries a carbon price. Use the carbon price setting to test the effect.',src:'electrive',u:'https://www.electrive.com/2026/03/06/eu-council-approves-2040-climate-target-with-90-ghg-reduction/'}];

function simLogic(){return `<ul class="ins">
 <li><b>Squares:</b> each square stands for a group of pallets. Pallets in the loop = trips per day × (cycle time + 3 buffer days) = ${nf(P.N/365*(P.T+3))}; one square ≈ ${nf(sim.k)} pallets.</li>

 <li><b>Destination:</b> each loop picks a retailer area at random, weighted by its share.</li>
 <li><b>Travel time:</b> the outbound leg takes 6–22% of the loop and grows with the lane’s distance; the pooled collection leg grows with the distance to the CHEP site. It is scaled so short lanes stay visible.</li>
 <li><b>Events per loop:</b> lost with probability = loss rate (white exchange: half at carriers, half through unredeemed vouchers); scrapped with probability = 1 ÷ pallet life; rejected at the retailer DC with probability = reject rate × DC automation, and at the plant with probability = reject rate × plant automation.</li>

 <li><b>Totals:</b> the counters are random and vary from run to run. Over a year they average out to the cost model’s figures; the line under the counters shows what the model expects for the same number of trips. The animation never feeds the euro or CO₂e figures.</li></ul>`}

  let al=Math.max(0,d.a);if(pm&&win&&d.st==='loop'&&d.s>=.70&&d.s<.90)al*=Math.max(0,1-(d.s-.70)/.06);
  cx.globalAlpha=al*(d.st==='loop'&&!loaded&&d.s>=.38?0.6:1);cx.fillStyle=d.st==='lost'?col('--loss'):d.st==='scrap'?col('--scrap'):d.amber?col('--rej'):mc;
  if(d.st==='new'||(atDc&&d.dl&&!pm)){cx.globalAlpha=al;cx.strokeStyle=d.st==='new'?mc:col('--exch');cx.lineWidth=1.5;cx.strokeRect(p[0]-sz/2,p[1]-sz/2,sz,sz)}else cx.fillRect(p[0]-sz/2,p[1]-sz/2,sz,sz);
 }
 cx.globalAlpha=1;
}
function counters(){const inc=sim.dots.filter(d=>d.st!=='lost'&&d.st!=='scrap').length*sim.k,m=sim.model,aw=sim.dots.filter(d=>d.st==='new'&&d.m==='pool').length*sim.k;
 const list=m==='pool'?[['Day',nf(Math.floor(sim.day))],['In the loop',nf(inc)],['Loaded trips',nf(sim.trips)],['Lost',nf(sim.lostC+sim.lostV)],['Awaiting CHEP delivery',nf(aw)],['Rejected at intake',nf(sim.rej)]]:m==='hyb'?[['Day',nf(Math.floor(sim.day))],['In the loop',nf(inc)],['Loaded trips',nf(sim.trips)],['Lost',nf(sim.lostC+sim.lostV)],['Awaiting CHEP delivery',nf(aw)],['Rejected at intake',nf(sim.rej)]]:[['Day',nf(Math.floor(sim.day))],['In the loop',nf(inc)],['Loaded trips',nf(sim.trips)],['Lost at carriers',nf(sim.lostC)],['Vouchers not redeemed',nf(sim.lostV)],['Rejected at intake',nf(sim.rej)]];
 $('counters').innerHTML=list.map(c=>`<div class="counter"><b>${c[1]}</b>${c[0]}</div>`).join('');
 if(!YR)YR=all(P);const o=YR[m]||YR[YR.hybInfo.same],lost=sim.lostC+sim.lostV;
 $('simyear').innerHTML=`<b>Per year for this option:</b> ${eur(o.all)} · ${nf(o.co2t)} t CO₂e · ${nf(o.met.newP)} new pallets. Simulated so far: ${nf(lost)} lost after ${nf(sim.trips)} trips; the model expects about ${nf(sim.trips*o.met.lost/P.N)}.`}
function simNote(){
 const m=sim.model;
 $('legend').innerHTML=`${m==='hyb'?`<span><i style="background:var(--pool)"></i>Pooled lanes</span><span><i style="background:var(--exch)"></i>Exchange lanes</span>`:`<span><i style="background:var(--${m})"></i>Loaded pallet (1 square = ${nf(sim.k)})</span>`}<span><i style="background:var(--${m==='hyb'?'exch':m});opacity:.55"></i>Empty pallet</span>${m==='pool'?'':'<span><i style="border:1.5px solid var(--exch)"></i>Voucher: swapped later</span>'}<span><i style="background:var(--rej)"></i>Rejected</span><span><i style="background:var(--loss)"></i>Lost</span><span><i style="background:var(--scrap)"></i>Scrapped</span><span><i style="background:var(--pool);transform:rotate(45deg)"></i>CHEP site</span>`;
 $('simnote').textContent=(step===0?`Click a ${UNIT()} to add or remove it as a retailer area. `:'')+`${NAME[m]}: ${nf(P.T,1)}-day cycle plus ${K.bufferDays} buffer days, about ${nf(P.dist)} km from plant to retailers. ${m==='exch'||m==='impr'?'White pallets are swapped at the dock or returned later against a voucher; losses happen at carriers and through unredeemed vouchers.':'Pooled empties go to '+siteText()+'; ordered pallets reach the plant within '+nf(P.window)+' days.'} ${CITYV()?'Lines run from the plant to each retailer city.':'Darker '+UNITS()+' take more of the volume.'}`;
}
function frame(ts){const dt=Math.min(.1,(ts-sim.last)/1000||0);sim.last=ts;if(sim.run){stepSim(dt/1.5*sim.speed);drawSim();if(ts-sim.tick>250){sim.tick=ts;counters()}}requestAnimationFrame(frame)}
function syncSim(){$('simmodel').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===sim.model));$('play').textContent=sim.run?'Pause':'Play';$('speed').textContent=sim.speed+'× speed'}
function inPoly(pt,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function buildSim(){
 $('simmodel').innerHTML=['exch','impr','pool','hyb'].map(k=>`<button data-m="${k}">${k==='exch'?'Today':k==='hyb'?'Hybrid':SHORT[k]}</button>`).join('');
 $('simmodel').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{sim.model=b.dataset.m;if(b.dataset.m!=='hyb'||all(P).hyb)sel=sim.model;simReset();simNote();syncSim();if(step===4)res4()}));
 $('play').addEventListener('click',()=>{sim.run=!sim.run;syncSim()});
 $('speed').addEventListener('click',()=>{sim.speed=sim.speed===1?4:sim.speed===4?12:1;syncSim()});
 cv.addEventListener('click',e=>{if(step!==0)return;if(CITYV())return;const r=cv.getBoundingClientRect(),pt=inv((e.clientX-r.left)/M.sc,(e.clientY-r.top)/M.sc),sh=SHAPES[prof.region];let hit=null;for(const a of Object.keys(sh))if(sh[a].some(ring=>inPoly(pt,ring))){hit=a;break}
  if(!hit||!RG().areas[hit])return;const i=prof.lanes.findIndex(l=>l.c===hit);if(i>=0){if(prof.lanes.length>1)prof.lanes.splice(i,1)}else prof.lanes.push({c:hit,w:15,po:false});changed();go(0)});
 syncSim();let rt2;window.addEventListener('resize',()=>{clearTimeout(rt2);rt2=setTimeout(()=>{layout();drawSim()},120)});
}
function init(){
 const fromHash=()=>STEPS.findIndex(s=>s[0]===(location.hash||'').slice(1));
 buildSteps();buildSim();layout();derive();simReset();go(Math.max(0,fromHash()),true);
 window.addEventListener('hashchange',()=>{const i=fromHash();if(i>=0&&i!==step)go(i,true)});
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawSim);
 requestAnimationFrame(frame);
}
if(typeof document!=='undefined')init();

</script>
